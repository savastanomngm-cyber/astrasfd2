[project]
name = "gamma-research-terminal"
version = "0.2.0"
description = "Order-flow research terminal for ES/NQ futures with gamma exposure analytics"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.49,<2",
    "plotly>=6,<7",
    "pandas>=2.2,<3",
    "numpy>=2,<2.4",
    "scipy>=1.15,<2",
    "polars>=1.30,<2",
    "pyarrow>=17,<24",
    "duckdb>=1.3,<2",
    "QuantLib>=1.38,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "hypothesis>=6,<7",
]

[project.scripts]
gamma-lab = "launch:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
